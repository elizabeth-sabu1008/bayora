name: Bayora Security & Test Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hypothesis bandit trivy

      - name: Run Unit & Acceptance Tests (pytest)
        run: |
          pytest -v tests/ --junitxml=junit/test-results.xml

      - name: Run Property-Based Fuzzing (Hypothesis)
        run: |
          pytest -v tests/test_break_platform.py -k "fuzz"

      - name: Run Static Security Analysis (Bandit)
        run: |
          # Exclude tests directory and check for hardcoded secrets, dangerous imports, SQLi
          bandit -r gateway/ common/ zones/ -ll -ii

      - name: Run Container Security & Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
